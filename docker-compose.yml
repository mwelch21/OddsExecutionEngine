# Container names are deliberately not pinned. Compose namespaces containers by
# project name, which defaults to the directory name, so two worktrees of this
# repo get distinct containers for free. Pinning `container_name` overrides that
# and makes the second stack collide.
#
# Every published host port is configurable so those two stacks can run at once.
# The defaults below are slot 0 — the values this repo has always used — so a
# plain `docker compose up` with no .env behaves exactly as it did before.
services:
  api:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-Odds Execution Engine}
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
      POSTGRES_DB: ${POSTGRES_DB:-odds_execution}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      QUOTE_PROVIDER: ${QUOTE_PROVIDER:-in_memory}
      ODDS_API_KEY: ${ODDS_API_KEY:-}
      ODDS_API_SPORTS: ${ODDS_API_SPORTS:-americanfootball_nfl}
      ODDS_API_REGIONS: ${ODDS_API_REGIONS:-us}
      ODDS_API_MARKETS: ${ODDS_API_MARKETS:-h2h,spreads,totals}
      OPPORTUNITY_TTL_MINUTES: ${OPPORTUNITY_TTL_MINUTES:-720}
      PROVIDER_CACHE_TTL_SECONDS: ${PROVIDER_CACHE_TTL_SECONDS:-300}
    ports:
      - "${APP_PORT:-8000}:8000"
  frontend:
    image: node:22-slim
    depends_on:
      - api
    working_dir: /app/frontend
    environment:
      FRONTEND_API_TARGET: http://api:8000
      # Vite binds the same port inside the container as it publishes on the
      # host. Keeping them equal means the HMR websocket the browser opens
      # points at a port that actually exists, with no clientPort override.
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
    command: sh -c "npm install && npm run dev"
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    volumes:
      - .:/app
      - frontend_node_modules:/app/frontend/node_modules
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odds_execution}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      # Host port is configurable: 5433 is a common default and collides with other
      # local stacks. The container port never changes, so POSTGRES_PORT stays 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-odds_execution}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  frontend_node_modules:
