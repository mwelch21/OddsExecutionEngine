[project]
name = "odds-execution-engine"
version = "0.1.0"
description = "Backend-first sports market execution platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16.0,<2.0.0",
    "fastapi>=0.116.0,<1.0.0",
    "pydantic-settings>=2.11.0,<3.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "mypy>=1.18.0,<2.0.0",
    "pytest>=8.4.0,<9.0.0",
    "pytest-asyncio>=1.2.0,<2.0.0",
    "ruff>=0.13.0,<1.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
plugins = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
odds-db-upgrade = "backend.app.infrastructure.persistence.commands:odds_db_upgrade_main"
odds-db-seed-demo = "backend.app.infrastructure.persistence.commands:odds_db_seed_demo_main"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
