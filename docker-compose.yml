services:
  api:
    build:
      context: .
    container_name: odds_execution_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-Odds Execution Engine}
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
      POSTGRES_DB: ${POSTGRES_DB:-odds_execution}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "${APP_PORT:-8000}:8000"
  postgres:
    image: postgres:16
    container_name: odds_execution_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odds_execution}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-odds_execution}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
